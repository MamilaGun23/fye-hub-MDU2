<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">FYE Hub architecture</title><desc id="desc">Express serves browser workspaces and public configuration. Browser workspaces connect directly to Supabase Auth, PostgreSQL and Storage. The portfolio walkthrough is independent.</desc><rect width="1200" height="560" rx="20" fill="#f2f5e9"/><g font-family="Arial,sans-serif" fill="#163f34"><text x="50" y="60" font-size="13" letter-spacing="3">FYE HUB / SYSTEM OVERVIEW</text><text x="50" y="110" font-size="32" font-weight="700">A small stack. Clear responsibilities.</text><rect x="50" y="175" width="270" height="145" rx="12" fill="#163f34"/><text x="76" y="214" fill="#d9f27c" font-size="12" letter-spacing="2">SERVER</text><text x="76" y="250" fill="#fff" font-size="24">Express + Node.js</text><text x="76" y="284" fill="#d3dfcd" font-size="14">Static assets + public configuration</text><path d="M320 247h65" stroke="#6f8c51" stroke-width="3"/><path d="m376 240 10 7-10 7" fill="none" stroke="#6f8c51" stroke-width="3"/><rect x="390" y="175" width="360" height="245" rx="12" fill="#fff" stroke="#c1d0b8"/><text x="416" y="214" font-size="12" letter-spacing="2">BROWSER</text><text x="416" y="251" font-size="24">Role-specific workspaces</text><text x="416" y="286" font-size="14">Student · Mentor · Supervisor · Admin</text><text x="416" y="324" font-size="14">HTML / CSS / JavaScript</text><text x="416" y="352" font-size="14">Shared auth + academic modules</text><text x="416" y="389" fill="#61744e" font-size="13">Direct authenticated service requests</text><path d="M750 297h65" stroke="#6f8c51" stroke-width="3"/><path d="m806 290 10 7-10 7" fill="none" stroke="#6f8c51" stroke-width="3"/><rect x="820" y="175" width="330" height="245" rx="12" fill="#e2edc4"/><text x="846" y="214" font-size="12" letter-spacing="2">SUPABASE</text><text x="846" y="251" font-size="24">Auth + data + files</text><text x="846" y="292" font-size="15">Authentication and identity</text><text x="846" y="328" font-size="15">PostgreSQL · RPCs · RLS policies</text><text x="846" y="364" font-size="15">Storage buckets and policies</text><text x="846" y="397" fill="#61744e" font-size="12">Database access rules are authoritative.</text><rect x="50" y="350" width="270" height="70" rx="10" fill="#e2edc4"/><text x="70" y="378" font-size="15" font-weight="700">Independent portfolio walkthrough</text><text x="70" y="402" font-size="12">Local content · No database connection</text><path d="M50 468h1100" stroke="#c1d0b8"/><text x="50" y="505" font-size="13" fill="#61744e">The complete base schema and live permission verification remain future work. Diagram describes the source architecture.</text></g></svg>
